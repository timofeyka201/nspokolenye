<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Поколение</title>
  <meta name="description" content="Пространство малой группы проекта «Поколение»: встречи, цели, материалы, Random Coffee">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Поколение">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <!-- Telegram Mini App SDK: в обычном браузере просто ничего не делает -->
  <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    // если приложение не загрузилось (нет сети или старые файлы в кэше) — показываем кнопку «Обновить», а не белый экран
    (function () {
      var shown = false;
      function fail() {
        var app = document.getElementById('app');
        if (shown || app.children.length) return;
        shown = true;
        app.innerHTML = '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif">'
          + '<div style="font-size:20px;font-weight:600">Не удалось загрузить «Поколение»</div>'
          + '<div style="color:#6E6E73;font-size:15px">Проверьте интернет и обновите страницу</div>'
          + '<button onclick="location.reload()" style="height:48px;padding:0 28px;border:0;border-radius:14px;background:#FF5714;color:#fff;font-size:17px;font-weight:600">Обновить</button></div>';
      }
      window.addEventListener('error', function (e) { if (e.target && (e.target.tagName === 'SCRIPT' && e.target.type === 'module')) setTimeout(fail, 1500); }, true);
      setTimeout(fail, 12000);
    })();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
